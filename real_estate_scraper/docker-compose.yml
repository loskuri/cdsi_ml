version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: real_estate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realestate123}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./models/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate"]
      interval: 10s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    container_name: real_estate_scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realestate123}
      POSTGRES_DB: ${POSTGRES_DB:-real_estate}
      SCHEDULE_DAY: ${SCHEDULE_DAY:-sunday}
      SCHEDULE_HOUR: ${SCHEDULE_HOUR:-2}
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs

volumes:
  postgres_data:
